<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGY-HUD — Mission Control for Google Antigravity</title>
    <meta
      name="description"
      content="Zero-proxy real-time telemetry HUD for Google Antigravity: GEN vs E2E speed, TTFT waterfalls, routed model IDs (f19), context X-ray, calibrated 5h/7d quota runway, and native multi-agent Swarm observability."
    />
    <meta name="theme-color" content="#090a0d" />
    <meta property="og:title" content="AGY-HUD — Mission Control for Google Antigravity" />
    <meta
      property="og:description"
      content="Live GEN/E2E TPS, OpenRouter-style call waterfalls, routed model f19 truth, context window X-ray, calibrated quota runway, and native AGY Swarm telemetry. Zero proxy, zero runtime deps."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skywalker512.github.io/agy-hud/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('agy-hud-site-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
