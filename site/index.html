<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGY-HUD — Native Telemetry for Google Antigravity</title>
    <meta
      name="description"
      content="Native side-pane telemetry for Google Antigravity: live GEN/E2E speed, Gemini Global Pulse 7d/24h curves & Cyber Arena PK, TTFT attribution, Prompt Cache TTL modeling, calibrated Ultra 20x quota runway, Swarm recursive rollup, and 2x PNG Wrapped posters."
    />
    <meta name="theme-color" content="#0a0b0e" />
    <meta property="og:title" content="AGY-HUD — Native Telemetry for Google Antigravity" />
    <meta
      property="og:description"
      content="Live GEN/E2E speed, OpenRouter 7d/24h Gemini curves & Cyber Arena PK, TTFT attribution, Cache TTL countdowns, calibrated quota runway, recursive Swarm rollup, and 2x PNG Wrapped share posters."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agy-hud.512.pub/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ROND,opsz,slnt,wdth,wght@0..100,6..144,-10..0,92..100,100..1000&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('agy-hud-site-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
