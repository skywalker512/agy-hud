    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <!-- Collapse iframe 4-hop waterfall: preload real HUD demo bundle in parallel with main site -->
    <link rel="preload" href="./hud-demo/styles.css" as="style" />
    <link rel="preload" href="./hud-demo/demo-fixture.js" as="script" />
    <link rel="preload" href="./hud-demo/demo-bridge.js" as="script" />
    <link rel="preload" href="./hud-demo/app.js" as="script" fetchpriority="high" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('agy-hud-site-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
        // Load Google Fonts after first paint so slow/blocked font CDNs never stall onload or compete with the HUD demo
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = 'https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ROND,opsz,slnt,wdth,wght@0..100,6..144,-10..0,92..100,100..1000&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap';
            document.head.appendChild(l);
          }, 0);
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
