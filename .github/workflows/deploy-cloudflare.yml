name: Deploy Website & Gemini Pulse Worker to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'plugin/sidecars/hud_panel/ui/**'
      - 'plugin/sidecars/hud_panel/lib/pulse-core.ts'
      - 'workers/gemini-pulse/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-agy-hud
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies & build static site
        run: |
          npm ci
          npm run build:site

      - name: Deploy Worker + Static Assets to agy-hud.512.pub
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: workers/gemini-pulse
        run: npx wrangler deploy
