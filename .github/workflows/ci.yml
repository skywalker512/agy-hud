name: CI — Typecheck, Tests & Bundle Parity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
            workers/gemini-pulse/package-lock.json

      - name: Install workspace dependencies
        run: |
          npm --prefix web ci
          npm --prefix site ci
          npm --prefix workers/gemini-pulse ci

      - name: Typecheck web, site, worker, and sidecar
        run: npm run typecheck

      - name: Run sidecar and tools unit tests
        run: npm test

      - name: Build UI bundle and verify committed bundle is up to date
        run: |
          npm run build:ui
          git diff --exit-code -- plugin/sidecars/hud_panel/ui/

      - name: Build static launch site
        run: npm run build:site
